<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Spa Race Engineer</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<main>

    <header>
        <div>
            <small>SPA-FRANCORCHAMPS</small>
            <h1>RACE ENGINEER</h1>
        </div>

        <b id="status">READY</b>
    </header>

    <section class="hero">

        <small>TARGET LAP</small>

        <div id="target">1:45</div>

        <div class="paces">

            <button type="button" onclick="setPace(105)">
                1:45
            </button>

            <button type="button" onclick="setPace(106)">
                1:46
            </button>

            <button type="button" onclick="setPace(107)">
                1:47
            </button>

            <button type="button" onclick="setPace(108)">
                1:48
            </button>

        </div>

    </section>

    <section class="call">

        <small>ENGINEER</small>

        <div id="call">READY</div>

        <p id="next">
            Press START when you're ready.
        </p>

    </section>

    <section class="stats">

        <div>
            LAP
            <strong id="lap">0:00.0</strong>
        </div>

        <div>
            NEXT
            <strong id="count">--</strong>
        </div>

        <div>
            CORNER
            <strong id="corner">—</strong>
        </div>

    </section>

    <div class="controls">

        <button
            type="button"
            id="start"
            onclick="startLap()">
            START LAP
        </button>

        <button
            type="button"
            id="stop"
            onclick="stopLap()">
            STOP
        </button>

        <button
            type="button"
            id="test"
            onclick="testVoice()">
            TEST VOICE
        </button>

    </div>

    <p class="note">
        Practice reference only.
        Corner timings should be calibrated
        against your F1 24 laps.
    </p>

</main>
